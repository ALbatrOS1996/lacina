<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Łacina dla historyka</title>
<meta name="description" content="Nauka łaciny do czytania źródeł historycznych: gramatyka, słownictwo, czytanka, dyplomatyka, chronologia, inskrypcje.">
<meta name="theme-color" content="#a1301f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Łacina">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23a1301f'/%3E%3Ctext x='16' y='24' font-family='Georgia' font-size='22' font-weight='700' fill='white' text-anchor='middle'%3EL%3C/text%3E%3C/svg%3E">
<style>
/* ============================================================
   ŁACINA DLA HISTORYKA – system wizualny
   Styl: „miękka glina” (wypukłe karty, przyciski z naciśnięciem)
   w palecie rękopisu: rubryka, złoto, lapis, pergamin.
   Czcionki: Crimson Pro (nagłówki, łacina) + Atkinson Hyperlegible (interfejs)
   ============================================================ */
:root {
  --bg: #f3ede1; --bg2: #ebe2cf; --surface: #fffdf8; --surface2: #f8f1e4; --ink: #2a231c; --muted: #6a5e51; --line: #e2d5be; --line2: #d3c3a5;
  --primary: #a1301f; --primary-d: #74200f; --primary-soft: #f6e1d9;
  --gold: #a87914; --gold-l: #e5b94f; --gold-soft: #f8ebc9;
  --ok: #2f7d47; --ok-d: #1f5c33; --ok-soft: #e0efe3; --bad: #b3361f; --bad-soft: #f9e1da;
  --lapis: #2e5aac; --lapis-d: #1e3f7d; --lapis-soft: #e2eaf7;
  --serif: 'Crimson Pro', 'Palatino Linotype', 'Book Antiqua', Georgia, serif;
  --sans: 'Atkinson Hyperlegible', 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
  --ms: 'Junicode', 'Segoe UI Historic', 'Noto Serif', 'Palatino Linotype', Cambria, serif;
  --r: 18px; --r-sm: 12px;
  --clay: 0 3px 0 var(--line2), 0 12px 24px -14px rgba(70, 45, 20, .35);
  --t-fast: 140ms; --t-mid: 240ms; --ease: cubic-bezier(.2, .8, .2, 1); --spring: cubic-bezier(.34, 1.56, .64, 1);
  --nav-h: 64px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15120e; --bg2: #1c1813; --surface: #221d17; --surface2: #2a241d; --ink: #eee5d5; --muted: #b3a693; --line: #3a3229; --line2: #2c261f;
  --primary: #e47a5f; --primary-d: #9c412c; --primary-soft: #3b2219; --gold: #e3b14f; --gold-l: #f0cd7c; --gold-soft: #3a2e14;
  --ok: #6cc287; --ok-d: #2f7d47; --ok-soft: #1b3324; --bad: #f08a72; --bad-soft: #3d221c; --lapis: #8db0e8; --lapis-d: #3f62a3; --lapis-soft: #1b2840;
  --clay: 0 3px 0 #0d0b08, 0 12px 24px -14px rgba(0, 0, 0, .7); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #15120e; --bg2: #1c1813; --surface: #221d17; --surface2: #2a241d; --ink: #eee5d5; --muted: #b3a693; --line: #3a3229; --line2: #2c261f;
  --primary: #e47a5f; --primary-d: #9c412c; --primary-soft: #3b2219; --gold: #e3b14f; --gold-l: #f0cd7c; --gold-soft: #3a2e14;
  --ok: #6cc287; --ok-d: #2f7d47; --ok-soft: #1b3324; --bad: #f08a72; --bad-soft: #3d221c; --lapis: #8db0e8; --lapis-d: #3f62a3; --lapis-soft: #1b2840;
  --clay: 0 3px 0 #0d0b08, 0 12px 24px -14px rgba(0, 0, 0, .7); color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 17px/1.6 var(--sans); -webkit-font-smoothing: antialiased;
  background-image: radial-gradient(circle at 15% 0%, var(--bg2) 0, transparent 45%), radial-gradient(circle at 100% 100%, var(--bg2) 0, transparent 40%); background-attachment: fixed; }
a { color: var(--lapis); text-underline-offset: 2px; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4 { font-family: var(--serif); font-weight: 700; line-height: 1.15; letter-spacing: -.005em; }
h1 { font-size: 2.3rem; margin: .1em 0 .35em; }
h2 { font-size: 1.6rem; margin: 1.3em 0 .5em; }
h3 { font-size: 1.28rem; margin: 1em 0 .4em; }
h4 { font-size: 1.15rem; margin: 1.3em 0 .35em; color: var(--primary); }
.la { font-family: var(--serif); font-size: 1.08em; }
i.la { font-style: italic; }
.ms { font-family: var(--ms); font-size: 1.15em; }
.ic { flex-shrink: 0; vertical-align: middle; }
::selection { background: var(--gold-soft); }

/* ---------- Układ ---------- */
.app { display: grid; grid-template-columns: 264px minmax(0, 1fr); min-height: 100vh; }
.side { background: var(--surface); border-right: 2px solid var(--line); padding: 18px 12px 30px; position: sticky; top: 0; height: 100vh; overflow-y: auto; z-index: 50; }
.brand { display: flex; gap: 12px; align-items: center; padding: 4px 8px 16px; margin-bottom: 6px; text-decoration: none; color: inherit; }
.brand .ini { font-family: var(--serif); font-size: 2rem; line-height: 1; color: #fff; font-weight: 700; width: 46px; height: 46px; display: grid; place-items: center;
  background: linear-gradient(145deg, var(--primary), var(--primary-d)); border-radius: 14px; box-shadow: 0 3px 0 var(--primary-d); }
.brand b { font-family: var(--serif); font-size: 1.22rem; display: block; line-height: 1.1; }
.brand small { color: var(--muted); font-size: .8rem; }
.nav-group { font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); padding: 14px 12px 6px; font-weight: 700; }
.nav a { display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 12px; color: var(--ink); text-decoration: none; font-size: .98rem; min-height: 44px; border: 2px solid transparent; transition: background var(--t-fast), border-color var(--t-fast); }
.nav a:hover { background: var(--surface2); }
.nav a.on { background: var(--primary-soft); color: var(--primary); font-weight: 700; border-color: color-mix(in srgb, var(--primary) 30%, transparent); }
.nav a .n { margin-left: auto; font-size: .75rem; background: var(--primary); color: #fff; border-radius: 99px; padding: 1px 8px; font-weight: 700; }
.main { padding: 14px 36px 90px; max-width: 1000px; width: 100%; }
.status { position: sticky; top: 0; z-index: 30; display: flex; gap: 6px; align-items: center; justify-content: flex-end; flex-wrap: wrap; padding: 10px 0; margin-bottom: 6px;
  background: linear-gradient(var(--bg) 70%, transparent); }
.st-item { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 99px; background: var(--surface); border: 2px solid var(--line); text-decoration: none; color: var(--ink); min-height: 40px; font-size: .95rem; cursor: pointer; }
.st-item b { font-weight: 700; }
.st-item.lvl b { font-family: var(--serif); font-size: 1.05rem; }
.icon-btn { padding: 5px 9px; }
.flame { color: var(--muted); display: inline-flex; }
.flame.lit { color: #e8742c; filter: drop-shadow(0 0 6px rgba(232, 116, 44, .45)); }
.topbar { display: none; }
.bottomnav { display: none; }
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .side { position: fixed; left: 0; top: 0; width: 290px; transform: translateX(-102%); transition: transform var(--t-mid) var(--ease); box-shadow: 8px 0 30px rgba(0, 0, 0, .25); padding-bottom: calc(var(--nav-h) + 30px); }
  .side.open { transform: none; }
  .main { padding: 6px 16px calc(var(--nav-h) + 40px + env(safe-area-inset-bottom)); }
  .status { justify-content: space-between; padding-top: calc(8px + env(safe-area-inset-top)); }
  .st-item { padding: 4px 9px; font-size: .9rem; }
  .st-item.lvl b { display: none; }
  h1 { font-size: 1.85rem; }
  .bottomnav { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--surface); border-top: 2px solid var(--line);
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); min-height: var(--nav-h); }
  .bottomnav a, .bottomnav button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: var(--muted); font-size: .72rem; font-weight: 700; background: none; border: 0; min-height: 48px; border-radius: 12px; cursor: pointer; position: relative; z-index: 0; }
  .bottomnav .on { color: var(--primary); }
  .bottomnav .on::before { content: ''; position: absolute; top: 2px; width: 44px; height: 30px; border-radius: 10px; background: var(--primary-soft); z-index: -1; }
  .bottomnav .n { position: absolute; top: 2px; right: calc(50% - 22px); background: var(--primary); color: #fff; font-size: .62rem; border-radius: 99px; padding: 0 5px; }
}
.scrim { position: fixed; inset: 0; background: rgba(20, 12, 5, .45); z-index: 45; opacity: 0; pointer-events: none; transition: opacity var(--t-mid); }
.scrim.on { opacity: 1; pointer-events: auto; }

/* ---------- Karty i przyciski (glina) ---------- */
.lead { color: var(--muted); font-size: 1.08rem; max-width: 68ch; }
.lead-in { font-size: 1.1rem; background: var(--gold-soft); border-radius: var(--r-sm); padding: 12px 16px; border-left: 4px solid var(--gold); }
.card { background: var(--surface); border: 2px solid var(--line); border-radius: var(--r); padding: 20px 22px; box-shadow: var(--clay); margin: 16px 0; }
.card h3:first-child, .card h2:first-child { margin-top: 0; }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
.grid .card { margin: 0; }
.tile { display: flex; flex-direction: column; gap: 4px; text-decoration: none; color: inherit; transition: transform var(--t-fast) var(--ease), box-shadow var(--t-fast), border-color var(--t-fast); cursor: pointer; }
.tile:hover { border-color: var(--line2); transform: translateY(-2px); box-shadow: 0 5px 0 var(--line2), 0 18px 30px -16px rgba(70, 45, 20, .4); }
.tile:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line2); }
.tile .k { font-size: .76rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.tile .t { font-family: var(--serif); font-size: 1.3rem; font-weight: 700; line-height: 1.15; }
.tile .d { color: var(--muted); font-size: .93rem; }
.tile .ti { width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; color: #fff; margin-bottom: 6px; box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .18); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 2px solid var(--line2); background: var(--surface); padding: 9px 18px; border-radius: 14px; cursor: pointer; text-decoration: none; color: var(--ink);
  font-size: .98rem; font-weight: 700; min-height: 46px; box-shadow: 0 3px 0 var(--line2); transition: transform var(--t-fast) var(--ease), box-shadow var(--t-fast), background var(--t-fast); }
.btn:hover { background: var(--surface2); }
.btn:active { transform: translateY(3px); box-shadow: 0 0 0 var(--line2); }
.btn.pri { background: var(--primary); border-color: var(--primary-d); color: #fff; box-shadow: 0 3px 0 var(--primary-d); }
.btn.pri:hover { filter: brightness(1.07); }
.btn.pri:active { box-shadow: 0 0 0 var(--primary-d); }
.btn.okb { background: var(--ok); border-color: var(--ok-d); color: #fff; box-shadow: 0 3px 0 var(--ok-d); }
.btn.gold { background: linear-gradient(180deg, var(--gold-l), var(--gold)); border-color: var(--gold); color: #2a1d05; box-shadow: 0 3px 0 #7a5608; }
.btn.sm { padding: 5px 12px; font-size: .88rem; min-height: 38px; border-radius: 11px; }
.btn.big { padding: 13px 26px; font-size: 1.08rem; min-height: 54px; }
.btn:disabled { opacity: .5; cursor: default; transform: none; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row.sp { justify-content: space-between; }
.tabs { display: flex; gap: 6px; overflow-x: auto; margin: 14px 0 18px; padding-bottom: 4px; scrollbar-width: thin; }
.tabs button { border: 2px solid var(--line); background: var(--surface); padding: 7px 14px; cursor: pointer; border-radius: 99px; color: var(--muted); font-weight: 700; white-space: nowrap; min-height: 42px; transition: all var(--t-fast); }
.tabs button.on { color: #fff; background: var(--lapis); border-color: var(--lapis-d); box-shadow: 0 2px 0 var(--lapis-d); }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 2px solid var(--line); background: var(--surface); border-radius: 99px; padding: 5px 13px; font-size: .9rem; cursor: pointer; user-select: none; min-height: 38px; font-weight: 700; transition: all var(--t-fast); }
.chip.on { background: var(--lapis-soft); border-color: var(--lapis); color: var(--lapis); }
.tag { display: inline-block; font-size: .74rem; border-radius: 6px; padding: 1px 7px; background: var(--surface2); color: var(--muted); border: 1px solid var(--line); vertical-align: middle; font-weight: 700; }
.tag.real { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.tag.model { background: var(--lapis-soft); color: var(--lapis); border-color: transparent; }
.tag.ep { background: var(--primary-soft); color: var(--primary); border-color: transparent; }
input[type=text], input[type=number], select, textarea { background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 9px 12px; max-width: 100%; min-height: 44px; }
textarea { width: 100%; min-height: 96px; font-family: var(--serif); font-size: 1.1rem; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--lapis); outline-offset: 2px; }
.muted { color: var(--muted); }
.small { font-size: .88rem; }
.warn { background: var(--primary-soft); border-left: 4px solid var(--primary); padding: 10px 14px; border-radius: 0 12px 12px 0; }
.tip { background: var(--lapis-soft); border-left: 4px solid var(--lapis); padding: 10px 14px; border-radius: 0 12px 12px 0; }
.exs p { margin: .5em 0; padding-left: 14px; border-left: 3px solid var(--line); }
.ok { color: var(--ok); } .bad { color: var(--bad); }
.done-mark { color: var(--ok); font-weight: 700; display: inline-flex; align-items: center; gap: 3px; }
.lesson-body { max-width: 72ch; }
.lesson-body p, .lesson-body li { font-size: 1.04rem; }

/* słowniczek i podpowiedzi */
abbr.term { text-decoration: none; border-bottom: 2px dotted var(--lapis); cursor: help; color: inherit; }
abbr.term:hover { background: var(--lapis-soft); border-radius: 3px; }
.termpop { position: absolute; z-index: 80; max-width: 300px; background: var(--ink); color: var(--bg); padding: 10px 13px; border-radius: 12px; font-size: .9rem; box-shadow: 0 10px 30px rgba(0, 0, 0, .3); animation: fadeUp var(--t-mid) var(--ease); }
.termpop b { font-family: var(--serif); font-size: 1.05rem; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100%); background: var(--surface); z-index: 90; box-shadow: -10px 0 40px rgba(0, 0, 0, .25); transform: translateX(102%); transition: transform var(--t-mid) var(--ease); display: flex; flex-direction: column; }
.drawer.open { transform: none; }
.drawer header { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; border-bottom: 2px solid var(--line); }
.drawer header h2 { margin: 0; font-size: 1.4rem; }
.drawer .body { overflow-y: auto; padding: 8px 18px 40px; }
.gl-item { padding: 10px 0; border-bottom: 1px solid var(--line); }
.gl-item b.ab { display: inline-block; min-width: 64px; font-family: var(--serif); color: var(--primary); font-size: 1.1rem; }
.wordgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin: 10px 0; }
.wordgrid div { background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 10px 12px; box-shadow: 0 2px 0 var(--line2); display: flex; flex-direction: column; }
.wordgrid i.la { font-size: 1.3rem; font-weight: 600; }
.wordgrid span { font-weight: 700; }
.wordgrid small { color: var(--muted); font-size: .8rem; }
.wordgrid .trap { border-color: var(--primary); background: var(--primary-soft); }
.formula { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0; }
.formula span { display: flex; flex-direction: column; align-items: center; background: var(--gold-soft); border: 2px solid var(--gold-l); border-radius: 14px; padding: 8px 14px; }
.formula i.la { font-size: 1.5rem; font-weight: 600; }
.formula small { color: var(--muted); font-weight: 700; }

/* tabele */
.tblwrap { overflow-x: auto; }
table.tbl { border-collapse: separate; border-spacing: 0; margin: 12px 0; font-size: .96rem; min-width: 300px; border: 2px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--surface); }
table.tbl th, table.tbl td { border-bottom: 1px solid var(--line); padding: 7px 12px; text-align: left; vertical-align: top; }
table.tbl tr:last-child td { border-bottom: 0; }
table.tbl th { background: var(--surface2); font-weight: 700; }
table.par td:first-child { color: var(--muted); }
table.par td b { color: var(--primary); }
.lesson-body table.tbl { display: block; overflow-x: auto; max-width: 100%; }

/* ćwiczenia */
.q { margin: 6px 0 18px; }
.q .qq { font-weight: 700; margin-bottom: 10px; font-size: 1.05rem; }
.opts { display: grid; gap: 10px; }
.opt { text-align: left; border: 2px solid var(--line2); background: var(--surface); border-radius: 14px; padding: 11px 16px; cursor: pointer; min-height: 50px; box-shadow: 0 3px 0 var(--line2); font-size: 1rem;
  transition: transform var(--t-fast) var(--ease), box-shadow var(--t-fast), background var(--t-fast), border-color var(--t-fast); }
.opt:hover:not(:disabled) { border-color: var(--lapis); background: var(--lapis-soft); }
.opt:active:not(:disabled) { transform: translateY(3px); box-shadow: none; }
.opt small { display: block; color: var(--muted); font-size: .78rem; margin-top: 1px; }
.opt.right { background: var(--ok-soft); border-color: var(--ok); box-shadow: 0 3px 0 var(--ok-d); }
.opt.wrong { background: var(--bad-soft); border-color: var(--bad); }
.opt:disabled { cursor: default; }
.expl { margin-top: 10px; font-size: .96rem; padding: 10px 14px; border-radius: 12px; background: var(--surface2); }
.expl.good { background: var(--ok-soft); }
.expl.badx { background: var(--bad-soft); }
.tok { cursor: pointer; border-radius: 6px; padding: 1px 4px; border: 2px solid transparent; transition: all var(--t-fast); }
.tok:hover { background: var(--lapis-soft); }
.tok.sel { background: var(--lapis-soft); border-color: var(--lapis); }
.tok.hit { background: var(--ok-soft); border-color: var(--ok); }
.tok.miss { background: var(--bad-soft); border: 2px dashed var(--bad); }
.tok.false { background: var(--bad-soft); text-decoration: line-through; }
.find-s { font-family: var(--serif); font-size: 1.3rem; line-height: 2.1; }
.drill-form { font-family: var(--serif); font-size: 2.6rem; color: var(--primary); margin: 6px 0; font-weight: 600; }
.score { font-family: var(--serif); font-size: 1.4rem; }
.qprog { height: 12px; background: var(--surface2); border-radius: 99px; overflow: hidden; border: 2px solid var(--line); margin: 6px 0 14px; }
.qprog i { display: block; height: 100%; background: linear-gradient(90deg, var(--ok), #59b072); border-radius: 99px; transition: width .5s var(--ease); box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .12); }
.lsteps { display: flex; gap: 8px; margin: 6px 0 18px; flex-wrap: wrap; }
.lsteps span { display: inline-flex; align-items: center; gap: 6px; font-size: .85rem; font-weight: 700; color: var(--muted); background: var(--surface); border: 2px solid var(--line); border-radius: 99px; padding: 4px 12px; }
.lsteps span.on { color: var(--primary); border-color: var(--primary); background: var(--primary-soft); }
.lsteps span.done { color: var(--ok); border-color: var(--ok); background: var(--ok-soft); }

/* czytanka */
.reader { font-family: var(--serif); font-size: 1.36rem; line-height: 2.1; }
.reader.l1 { line-height: 1.35; }
.w { cursor: pointer; border-radius: 4px; }
.w:hover { background: var(--lapis-soft); }
.w.looked { border-bottom: 2px dotted var(--primary); }
.reader.l1 .wb, .reader.l2 .wb.hasg { display: inline-flex; flex-direction: column; align-items: flex-start; vertical-align: top; margin: 0 4px 12px 0; }
.wb .g { display: none; font-family: var(--sans); font-size: .64rem; line-height: 1.25; color: var(--muted); max-width: 14ch; }
.reader.l1 .wb .g, .reader.l2 .wb.hasg .g { display: block; }
.reader.l2 .wb.hasg .w { color: var(--primary); }
.wpop { position: absolute; z-index: 60; background: var(--surface); border: 2px solid var(--line); border-radius: 14px; box-shadow: 0 12px 34px rgba(0, 0, 0, .2); padding: 12px 16px; max-width: 340px; font-size: .93rem; animation: fadeUp var(--t-mid) var(--ease); }

  background: radial-gradient(circle at 35% 30%, var(--gold-l), var(--gold)); box-shadow: inset 0 -5px 0 rgba(0, 0, 0, .18), 0 6px 18px -6px rgba(168, 121, 20, .7); }

<script>
/* ============================================================
   MORFOLOGIA: normalizacja pisowni, generator paradygmatów,
   indeks form i analizator
   ============================================================ */
'use strict';
var LAT = window.LAT = window.LAT || {};

(function () {
  var CASES = ['nom.', 'gen.', 'dat.', 'acc.', 'abl.'];
  var PERS = ['1 os. lp.', '2 os. lp.', '3 os. lp.', '1 os. lm.', '2 os. lm.', '3 os. lm.'];
  var PA = ['m', 's', 't', 'mus', 'tis', 'nt'];
  var PP = ['r', 'ris', 'tur', 'mur', 'mini', 'ntur'];

  /* ---------- Normalizacja pisowni (klucz wyszukiwania) ----------
     Sprowadza warianty średniowieczne i klasyczne do wspólnego klucza:
     ae/oe→e, j→i, v→u, y→i, ti+samogłoska→ci, ch→h, h znika,
     podwojone spółgłoski→pojedyncze, mpn→mn. */
  function norm(w) {
    w = String(w || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    w = w.replace(/æ/g, 'ae').replace(/œ/g, 'oe');
    w = w.replace(/j/g, 'i').replace(/v/g, 'u').replace(/y/g, 'i');
    w = w.replace(/ae/g, 'e').replace(/oe/g, 'e');
    w = w.replace(/mpn/g, 'mn');
    w = w.replace(/ti(?=[aeiou])/g, 'ci');
    w = w.replace(/ch/g, 'h').replace(/h/g, '');
    w = w.replace(/([bcdfglmnprstx])\1/g, '$1');
    return w.replace(/[^a-z]/g, '');
  }
  LAT.norm = norm;

  /* Opis zmian pisowni (do narzędzia „normalizator”) */
  LAT.explainSpelling = function (w) {
    var notes = [];
    var s = w.toLowerCase();
    var cls = s;
    if (/e/.test(s)) notes.push('e może odpowiadać klasycznemu ae lub oe (ecclesie = ecclesiae, pena = poena)');
    if (/ci[aeiou]/.test(s)) { notes.push('ci + samogłoska często = klasyczne ti (gracia = gratia, donacio = donatio)'); cls = cls.replace(/ci(?=[aeiou])/g, 'ti'); }
    if (/ch/.test(s)) { notes.push('ch bywa zapisem h (michi = mihi, nichil = nihil)'); cls = cls.replace(/michi/g, 'mihi').replace(/nichil/g, 'nihil'); }
    if (/y/.test(s)) { notes.push('y = i (ymago = imago, sylva = silva)'); cls = cls.replace(/y/g, 'i'); }
    if (/mpn/.test(s)) { notes.push('mpn = mn (dampnum = damnum, sollempnis = sollemnis)'); cls = cls.replace(/mpn/g, 'mn'); }
    if (/j/.test(s)) { notes.push('j = i (Johannes = Iohannes)'); }
    if (/^h/.test(s)) notes.push('h na początku bywa dodawane lub opuszczane (hortus/ortus, habundantia = abundantia)');
    if (/([bcdfglmnprst])\1/.test(s)) notes.push('podwojenia spółgłosek bywają dowolne (litera/littera, quatuor/quattuor)');
    if (/[^aeiou]e(?=[^aeiou]|$)/.test(s) && !/ae/.test(s)) {
      notes.push('przy szukaniu w słowniku klasycznym spróbuj e → ae w końcówkach (-e → -ae, -arum zostaje)');
    }
    return { notes: notes, guess: cls };
  };

  function push(out, f, an, meta) {
    String(f).split('/').forEach(function (x) {
      if (x) out.push(Object.assign({ f: x, an: an }, meta || {}));
    });
  }

  function decline(out, sg, pl, label, gd, kind) {
    for (var i = 0; i < 5; i++) {
      if (sg) push(out, sg[i], (label || '') + CASES[i] + ' lp.' + (gd ? ' ' + gd : ''), { k: kind, cs: i, nm: 's', gd: gd || '' });
    }
    for (var j = 0; j < 5; j++) {
      if (pl) push(out, pl[j], (label || '') + CASES[j] + ' lm.' + (gd ? ' ' + gd : ''), { k: kind, cs: j, nm: 'p', gd: gd || '' });
    }
  }

  /* ---------- Rzeczowniki ---------- */
  function nounTables(cls, nom, gen) {
    var st;
    switch (cls) {
      case 'n1': st = gen.slice(0, -2);

LAT.parseLexicon = function (raw, prefix) {
  var out = [];
  raw.split('\n').forEach(function (line, i) {
    line = line.trim();
    if (!line) return;
    var c = line.split('|').map(function (s) { return s.trim(); });
    if (c.length < 4 || !c[3]) return;
    var e = {
      id: (prefix || 'w') + i,
      head: c[0],
      parts: c[0].split(',').map(function (s) { return s.trim(); }),
      cls: c[1],
      g: c[2],
      pl: c[3],
      fields: (c[4] || '').split(/\s+/).filter(Boolean),
      note: c[5] || ''
    };
    if (/^pron:/.test(e.cls)) { e.pron = e.cls.slice(5); e.cls = 'pron'; }
    out.push(e);
  });
  return out;
};

<p>Przymiotnik zgadza się z rzeczownikiem w <b>rodzaju, liczbie i przypadku</b>, ale nie musi mieć tej samej końcówki: <i class="la">omnibus pertinentiis</i>, <i class="la">perpetuo iure</i>, <i class="la">presentes litteras</i>.</p>

<p>Tryb łączący (<i>coniunctivus</i>) wyraża życzenie, rozkaz w 3 osobie, cel lub skutek. W dokumentach spotkasz go w formułach od pierwszych linijek.</p>

<tr><td><i class="la">Notum <u>sit</u> omnibus</i></td><td>coni. praes. od <i>esse</i></td><td>Niech będzie wiadomo wszystkim</td></tr>

<tr><td><i class="la">ut… <u>possideat</u></i></td><td>coni. praes.</td><td>aby posiadał</td></tr>

<h4>Rozpoznawanie</h4>
<p><b>Praesens:</b> I koniug. <i>-e-</i> (<i class="la">confirmet</i>), pozostałe <i>-a-</i> (<i class="la">habeat, mittat, audiat</i>).<br><b>Imperfectum:</b> bezokolicznik + końcówka (<i class="la">daret, haberet, esset</i>).<br><b>Perfectum:</b> <i>-erim, -eris, -erit…</i> (<i class="la">noverint, dederit</i>).<br><b>Plusquamperf.:</b> <i>-issem…</i> (<i class="la">dedisset</i>).</p>

<p>Ablativus absolutus („ablatyw oderwany”) to <b>rzeczownik/zaimek + imiesłów w ablatywie</b>, gramatycznie niezależne od reszty zdania. Pełni funkcję zdania okolicznikowego (czasu, przyczyny, przyzwolenia, warunku).</p>
<table class="tbl"><tr><th>łacina</th><th>budowa</th><th>przekład</th></tr>
<tr><td><i class="la">presentibus hiis testibus</i></td><td>abl. + PPA (praesens)</td><td>w obecności tych świadków</td></tr>
<tr><td><i class="la">quibus (annis) elapsis</i></td><td>abl. + PPP</td><td>po upływie tych (lat)</td></tr>
<tr><td><i class="la">Deo volente</i></td><td>abl. + PPA</td><td>jeśli Bóg pozwoli</td></tr>
<tr><td><i class="la">exceptis… </i></td><td>PPP + abl.</td><td>z wyjątkiem…</td></tr>
<tr><td><i class="la">mediante iustitia</i></td><td>PPA + abl.</td><td>za pośrednictwem sprawiedliwości (= drogą prawną)</td></tr>
<tr><td><i class="la">rege regnante</i></td><td>abl. + PPA</td><td>za panowania króla</td></tr></table>
<h4>Jak tłumaczyć</h4>
<ul><li>PPA → czynność <b>współczesna</b>: „gdy…, podczas gdy…, w obecności…”</li>

<li>Bez imiesłowu (rzeczownik + rzeczownik/przymiotnik): <i class="la">Iohanne papa</i> – „za papieża Jana”.</li></ul>
<p class="tip">Najprostszy test: czy grupę w ablatywie można wyciąć, a zdanie dalej jest gramatycznie pełne? Jeśli tak, to prawie na pewno abl. abs.</p>

{
  id: 'l10', title: 'Accusativus cum infinitivo i średniowieczne quod', short: 'AcI, NcI (leguntur contulisse), dico quod…',
  body: `
<p>Po czasownikach mówienia, myślenia, wiedzy i postrzegania łacina klasyczna używa <b>accusativus cum infinitivo</b> (AcI): podmiot zdania podrzędnego stoi w bierniku, a orzeczenie w bezokoliczniku.</p>
<div class="exs"><p><i class="la">Scimus <u>ducem</u> villam ecclesie <u>dedisse</u>.</i> – Wiemy, <b>że książę dał</b> wieś kościołowi.</p></div>
<p>Tłumacząc, wstaw „że”, biernik zamień na mianownik, a bezokolicznik na czasownik osobowy. Czas bezokolicznika wyraża stosunek do zdania głównego: <i>-re</i> = współczesność, <i>-isse</i> = uprzedniość, <i>-turum esse</i> = następczość.</p>
<h4>Nominativus cum infinitivo (NcI)</h4>
<p>Przy czasowniku w stronie biernej (<i class="la">dicitur, videtur, legitur</i>) podmiot stoi w mianowniku:</p>
<div class="exs"><p><i class="la"><u>Dagome iudex et Ote senatrix</u>… <u>leguntur</u> beato Petro <u>contulisse</u>…</i> – <b>Czyta się, że</b> sędzia Dagome i senatorka Ote <b>nadali</b> św. Piotrowi…</p></div>
<h4>Łacina średniowieczna: quod / quia</h4>
<p>Od późnej starożytności AcI coraz częściej zastępuje zdanie z <b>quod</b> lub <b>quia</b> („że”) i trybem oznajmującym albo łączącym, jak w polskim:</p>
<div class="exs"><p><i class="la">Notum facimus, <u>quod</u> villam… <u>damus</u>.</i> – Podajemy do wiadomości, <b>że dajemy</b> wieś…</p>
<p><i class="la">Petrus respondit, <u>quod</u> non <u>tenetur</u>.</i> – Piotr odpowiedział, <b>że nie jest zobowiązany</b>.</p></div>
<p class="warn">Nie tłumacz automatycznie <i>quod</i> jako „który” czy „ponieważ”. Po <i class="la">notum facimus, recognovit, dixit, respondit</i> prawie zawsze znaczy „że”.</p>`,
  ex: [
    { t: 'mcq', q: '<i class="la">Petrus respondit, quod non tenetur</i>:', o: ['Piotr odpowiedział, który nie jest trzymany', 'Piotr odpowiedział, że nie jest zobowiązany', 'Piotr odpowiedział, ponieważ nie trzyma', 'Piotr nie odpowiedział'], a: 1, e: 'Średniowieczne <i>quod</i> = „że” zamiast AcI.' },
    { t: 'mcq', q: 'W <i class="la">leguntur contulisse</i> mamy do czynienia z:', o: ['ablativus absolutus', 'nominativus cum infinitivo', 'gerundivum', 'coniunctivus'], a: 1, e: 'Podmiot (Dagome, Ote, synowie) w mianowniku + <i>leguntur</i> + bezokolicznik.' },
    { t: 'find', q: 'Zaznacz biernik i bezokolicznik tworzące AcI.', s: 'Dicunt [[ducem]] villam monasterio [[dedisse]].', e: '„Mówią, że książę dał wieś klasztorowi”.' }
  ]
},

{

  body: `
<p><b>Cum historicum</b> (<i class="la">cum</i> + coni. impf./pqpf.) to podstawowa konstrukcja narracji kronikarskiej: „gdy”, „ponieważ”, „chociaż”.</p>

<p><i class="la"><u>Cum</u> autem <u>nolimus</u> cives nostros iniuriis affici, mandamus…</i> – <b>Ponieważ</b> zaś nie chcemy, by nasi mieszczanie doznawali krzywd, polecamy…</p></div>
<p>Znaczenia <i class="la">cum</i>: z ablatywem – przyimek „z”; z indicativus – „gdy, kiedy”; z coniunctivus – „gdy” (narracja), „ponieważ”, „chociaż”.</p>
<h4>Consecutio temporum (następstwo czasów)</h4>

  id: 'l14', title: 'Łacina średniowieczna i nowożytna', short: 'Ortografia, słownictwo, składnia – co się zmienia',
  body: `
<p>Łacina średniowieczna to nie „zepsuta klasyczna”, tylko żywy język pisany z własnymi normami, które zmieniały się regionalnie. Dla polskiego historyka to zwykle podstawowy materiał.</p>
<h4>Ortografia</h4>
<table class="tbl"><tr><th>średniowieczna</th><th>klasyczna</th><th>przykład</th></tr>
<tr><td>e</td><td>ae, oe</td><td><i class="la">ecclesie, pena, celum</i> → ecclesiae, poena, caelum</td></tr>
<tr><td>ci + samogł.</td><td>ti + samogł.</td><td><i class="la">gracia, donacio, presencium</i></td></tr>
<tr><td>ch / h dodane lub opuszczone</td><td>h</td><td><i class="la">michi, nichil; ortus/hortus; habundare</i></td></tr>
<tr><td>y</td><td>i</td><td><i class="la">ymago, ydoneus, sylva</i></td></tr>
<tr><td>mpn, mpt</td><td>mn, mt</td><td><i class="la">dampnum, sollempnis, contempnere</i></td></tr>
<tr><td>pojedyncze/podwójne spółgłoski</td><td>—</td><td><i class="la">litera/littera, comodum, aparere</i></td></tr>
<tr><td>j, v</td><td>i, u</td><td><i class="la">Johannes, juramentum</i></td></tr></table>
<p>W XVI–XVIII w. humaniści przywracają pisownię klasyczną (<i class="la">ae, ti</i>), więc metryki i akta nowożytne często wyglądają „klasycznie”, choć słownictwo pozostaje późne.</p>
<h4>Składnia</h4>
<ul>
<li><b>quod/quia + verbum finitum</b> zamiast AcI (lekcja 10).</li>
<li><b>suus/eius</b> używane zamiennie (lekcja 4).</li>
<li><b>de + abl.</b> zamiast dopełniacza: <i class="la">heres de Wola</i> – „dziedzic Woli”, <i class="la">civis de Cracovia</i>.</li>
<li><b>przyimki o nowych znaczeniach</b>: <i class="la">infra</i> = „w obrębie” (klas. „poniżej”), <i class="la">per</i> = „przez” (sprawcy), <i class="la">sub</i> = „pod (karą)”: <i class="la">sub poena</i>.</li>
<li><b>zanik rozróżnień trybów</b>: coni. tam, gdzie klasycznie byłby ind., i odwrotnie.</li>
<li>analityczne formy strony biernej: <i class="la">datum fuit</i> zamiast <i class="la">datum est</i>.</li>
</ul>
<h4>Słownictwo</h4>
<p>Słowa klasyczne zmieniają znaczenie (<i class="la">miles</i> – rycerz, <i class="la">comes</i> – możny, <i class="la">villa</i> – wieś, <i class="la">honor</i> – urząd), pojawiają się latynizacje słów polskich i niemieckich (<i class="la">kmeto</i> – kmieć, <i class="la">scultetus</i> – sołtys, <i class="la">laneus</i> – łan, <i class="la">vlodarius</i> – włodarz), a tytuły grzecznościowe pozwalają odczytać stan społeczny (<i class="la">generosus, famatus, honestus, laboriosus</i>). Zajrzyj do modułu <b>Pułapki tłumacza</b>.</p>`,

  q: [
    { q: 'Kto lokuje wieś?', o: ['książę', 'Mikołaj, dziedzic Woli', 'sołtys Piotr', 'kmiecie'], a: 1, e: '<i>Nos Nicolaus, heres de Wola</i>.' },

  tr: 'My, Mikołaj, dziedzic Woli, treścią niniejszego pisma podajemy do wiadomości wszystkim, że zważając na nasz pożytek dajemy naszą wieś Wolę do lokowania na prawie niemieckim roztropnemu mężowi Piotrowi, sołtysowi, i jego prawowitym następcom. Dajemy także temuż Piotrowi trzy wolne łany na sołectwo oraz karczmę i młyn. Dalej: kmieciom osiadłym we wspomnianej wsi przyznajemy piętnaście lat wolnizny. Po ich upływie każdy kmieć będzie zobowiązany płacić z każdego łanu jedną grzywnę czynszu w święto św. Marcina. Sprawy większe, mianowicie o głowę i członki, zastrzegamy sobie; mniejsze będzie sądził sołtys i z sądu będzie miał trzeci denar.'

  tr: 'W imię świętej i niepodzielnej Trójcy, amen. My, Bolesław, z łaski Bożej książę krakowski i sandomierski, wszystkim wiernym Chrystusowym pozdrowienie w Panu. Ponieważ sprawy, które dzieją się w czasie, zwykło się – aby nie przeminęły wraz z czasem – umieszczać w ustach świadków i utrwalać pamięcią pisma, chcemy, aby do wiadomości wszystkich, tak obecnych, jak przyszłych, doszło, że zważając na wierne usługi, które nasz miły rycerz Jan zwany Gryfą przez długi czas nam świadczył, naszą wieś Lubczę z polami, łąkami, lasami, wodami i wszystkimi pożytkami temuż Janowi i jego prawowitym następcom dajemy, darujemy i nadajemy do posiadania prawem dziedzicznym na wieczność, zwalniając tęż wieś od wszystkich świadczeń i danin prawa polskiego. Jeśliby zaś ktoś odważył się naruszyć tę naszą darowiznę, niech wie, że ściągnie na siebie gniew Boga wszechmogącego. Na świadectwo tego kazaliśmy zabezpieczyć niniejszy dokument umocnieniem naszej pieczęci. Działo się i dano w Krakowie roku Pańskiego tysiąc dwieście sześćdziesiątego piątego, w poniedziałek po święcie św. Michała, w obecności tych świadków: pana Mikołaja, kasztelana krakowskiego, pana Piotra, wojewody sandomierskiego, i Stefana, naszego pisarza, który spisał niniejszy dokument. Szczęśliwie, amen.'
},

  read: 'IMP·CAES·FL·CONSTANTINO·MAXIMO\nP·F·AVGVSTO·S·P·Q·R\nQVOD·INSTINCTV·DIVINITATIS·MENTIS\nMAGNITVDINE·CVM·EXERCITV·SVO\nTAM·DE·TYRANNO·QVAM·DE·OMNI·EIVS\nFACTIONE·VNO·TEMPORE·IVSTIS\nREMPVBLICAM·VLTVS·EST·ARMIS\nARCVM·TRIVMPHIS·INSIGNEM·DICAVIT',
  exp: 'Imp(eratori) Caes(ari) Fl(avio) Constantino Maximo p(io) f(elici) Augusto s(enatus) p(opulus)q(ue) R(omanus), quod instinctu divinitatis, mentis magnitudine cum exercitu suo tam de tyranno quam de omni eius factione uno tempore iustis rempublicam ultus est armis, arcum triumphis insignem dicavit.',
  tr: 'Cesarzowi Flawiuszowi Konstantynowi Wielkiemu, pobożnemu, szczęśliwemu Augustowi – senat i lud rzymski, ponieważ z natchnienia bóstwa i dzięki wielkości ducha wraz ze swoim wojskiem jednocześnie pomścił państwo sprawiedliwym orężem zarówno na tyranie, jak i na całym jego stronnictwie – poświęcił ten łuk, wyróżniony przedstawieniami tryumfów.',
  notes: 'Najsłynniejsza dwuznaczność epigrafiki: INSTINCTV DIVINITATIS („z natchnienia bóstwa”) nie przesądza, o jakie bóstwo chodzi – w 315 r. odczytać to mogli zarówno chrześcijanie, jak i poganie. „Tyran” to Maksencjusz pokonany przy moście Mulwijskim (312). Zwróć uwagę na konstrukcję tam… quam („zarówno… jak i”) i deponens ultus est („pomścił”).',
  q: [
    { q: '<b>ultus est</b> to:', o: ['został pomszczony', 'pomścił (deponens: forma bierna, znaczenie czynne)', 'jest ostatni', 'będzie mścił'], a: 1, e: '<i>ulciscor, ulcisci, ultus sum</i> – deponens.' },
    { q: 'Dlaczego historycy dyskutują o słowach <b>INSTINCTV DIVINITATIS</b>?', o: ['bo są źle wykute', 'bo nie mówią, o jakie bóstwo chodzi – chrześcijańskie czy pogańskie', 'bo dodano je w średniowieczu', 'bo to skrót'], a: 1, e: 'Celowo neutralna formuła w okresie przemian religijnych.' },
    { q: 'Kto jest „tyranem” (TYRANNO)?', o: ['Neron', 'Maksencjusz, pokonany w 312 r.', 'Dioklecjan', 'Attyla'], a: 1, e: 'Bitwa przy moście Mulwijskim.' }
  ]
},

{
  id: 'i17', cat: 'arch', title: 'Katedra na Wawelu – inskrypcja nad portalem', place: 'Kraków, Wawel', date: 'tablica nowożytna; treść o 1320 r.',
  img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/4/4b/Krak%C3%B3w_Wawel_3_ko%C5%9Bci%C3%B3%C5%82_portal_od_pd._detal.jpg/1280px-Krak%C3%B3w_Wawel_3_ko%C5%9Bci%C3%B3%C5%82_portal_od_pd._detal.jpg',
  page: 'https://commons.wikimedia.org/wiki/File:Krak%C3%B3w_Wawel_3_ko%C5%9Bci%C3%B3%C5%82_portal_od_pd._detal.jpg', credit: 'Januszk57, CC BY-SA 4.0',
  read: 'D. O. M. B. M. V. SS. PATRONIS\nECCLESIAM HANC IGNE ABSVMPTAM NANKERVS SILESIVS\nEP̃VS CRAC. IN HANC FORMAM RESTITVIT; RELIQVI POSTEA\nSVCC̃ORES EP̃I ET CAPITVLVM CVM EX COMMVNI TVM VERO\nQVIDAM EX PRIVATO CENSV ADORNAVERE.\nA. D. MCCCXX.',
  exp: 'D(eo) O(ptimo) M(aximo), B(eatae) M(ariae) V(irgini), s(anctis) patronis. Ecclesiam hanc igne absumptam Nankerus Silesius ep(iscop)us Crac(oviensis) in hanc formam restituit; reliqui postea succ(esso)res ep(iscop)i et capitulum cum ex communi tum vero quidam ex privato censu adornavere. A(nno) D(omini) MCCCXX.',
  tr: 'Bogu Najlepszemu Największemu, Najświętszej Marii Pannie i świętym patronom. Ten kościół, strawiony przez ogień, Nanker Ślązak, biskup krakowski, odbudował w tym kształcie; pozostali biskupi, jego następcy, i kapituła ozdobili go potem – zarówno ze wspólnych funduszy, jak i niektórzy z prywatnego majątku. Roku Pańskiego 1320.',
  notes: 'Znakomity materiał do skrótów: tylda nad EP̃VS i SVCC̃ORES to ten sam znak kontrakcji, co w rękopisach (episcopus, successores). D.O.M. otwiera niemal każdą nowożytną tablicę w polskich kościołach. Ablativus absolutus? Nie – igne absumptam to imiesłów bierny zgodny z ecclesiam („strawiony przez ogień”). Pułapka datacyjna: tablica jest nowożytna, a podana data dotyczy początku odbudowy za biskupa Nankera. Zapis adornavere = adornaverunt (końcówka -ere w 3. os. l. mn. czasu przeszłego).',
  q: [
    { q: 'Rozwiń <b>EP̃VS</b>:', o: ['epus', 'episcopus', 'epistulas', 'eius'], a: 1, e: 'Tylda oznacza opuszczone litery w środku słowa (kontrakcja).' },
    { q: 'Co oznacza <b>D.O.M.</b>?', o: ['Dom', 'Deo Optimo Maximo – Bogu Najlepszemu Największemu', 'Domini', 'data obitus mortis'], a: 1, e: 'Nagłówek tablic fundacyjnych i nagrobnych.' },
    { q: 'Czy tablica pochodzi z 1320 r.?', o: ['tak, to data wykucia', 'nie – to późniejsza tablica, która upamiętnia odbudowę z 1320 r.'], a: 1, e: 'Jak w Panteonie: data w napisie nie musi być datą napisu.' },
    { q: '<b>adornavere</b> to:', o: ['bezokolicznik', 'perfectum, 3. os. l. mn. = adornaverunt („ozdobili”)', 'tryb rozkazujący', 'imiesłów'], a: 1, e: 'Końcówka <i>-ere</i> zamiast <i>-erunt</i> – częsta w tekstach podniosłych.' }
  ]
},
{
  id: 'i18', cat: 'pomnik', title: 'Epitafium Bartolomea Berrecciego', place: 'Kraków, kościół Bożego Ciała', date: 'tablica późniejsza; Berrecci zm. 1537',
  img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/5/54/Epiafium_B._BerrecciegoObraz_039.jpg/1280px-Epiafium_B._BerrecciegoObraz_039.jpg',
  page: 'https://commons.wikimedia.org/wiki/File:Epiafium_B._BerrecciegoObraz_039.jpg', credit: 'Miezian, CC BY-SA 3.0',
  read: 'D. O. M.\nMAGISTRO BARTHOLOMAEO BERECCIO FLORENTINO\nSIGISMUNDI REGIS LAPICIDAE\nQUOD SACELLO REGIO TRANSALPINAS INTER AEDES\nLONGE VENUSTISSIMO ALIISQUE MONUMENTIS\nPATRIAM NOBIS PRAECLARE ORNAVERIT\nPOLONI\nMARMOREAM HANC TABULAM PIAE MEMORIAE\nGRATIQUE ANIMI PIGNUS TRIA POST SAECULA\nOBLIVIONIS IN TEMPLO UBI TESTAMENTO SEPELIRI\nJUSSIT LUBENTES POSUERUNT.\nNATUS IN VALLE DE SIEVE, POLONIAM ACCESSUS 1517\nMORTUS CRACOVIAE 1537',
  exp: 'D(eo) O(ptimo) M(aximo). Magistro Bartholomaeo Bereccio Florentino, Sigismundi regis lapicidae, quod sacello regio, transalpinas inter aedes longe venustissimo, aliisque monumentis patriam nobis praeclare ornaverit, Poloni marmoream hanc tabulam piae memoriae gratique animi pignus tria post saecula oblivionis in templo, ubi testamento sepeliri iussit, lubentes posuerunt.',
  tr: 'Bogu Najlepszemu Największemu. Mistrzowi Bartłomiejowi Berrecciemu z Florencji, kamieniarzowi króla Zygmunta, za to, że kaplicą królewską – zdecydowanie najpiękniejszą budowlą po tej stronie Alp – i innymi dziełami wspaniale ozdobił naszą ojczyznę, Polacy po trzech wiekach zapomnienia chętnie umieścili tę marmurową tablicę jako zadatek pobożnej pamięci i wdzięczności, w kościele, w którym w testamencie kazał się pochować. Urodzony w dolinie Sieve, przybył do Polski w 1517 r., zmarł w Krakowie w 1537 r.',
  notes: 'Twórca Kaplicy Zygmuntowskiej (sacellum regium). Klasyczny układ nowożytnego epitafium: D.O.M., adresat w celowniku (MAGISTRO… LAPICIDAE), uzasadnienie (QUOD + coniunctivus ornaverit – przyczyna podana jako opinia fundatorów), podmiot (POLONI) i orzeczenie na końcu (POSUERUNT). Tablica pochodzi z XIX w. („po trzech wiekach zapomnienia”). Uwaga: w ostatnich wierszach zapisano ACCESSUS, choć poprawnie gramatycznie byłoby ACCESSIT – nawet napisy w kamieniu zawierają usterki.',
  q: [
    { q: 'Kto ufundował tablicę?', o: ['król Zygmunt', 'sam Berrecci', 'Polacy (POLONI)', 'Florentczycy'], a: 2, e: 'Podmiot stoi samotnie w osobnym wierszu: POLONI… POSUERUNT.' },
    { q: 'Czym jest <b>sacellum regium</b>?', o: ['skarbiec królewski', 'kaplica królewska (Zygmuntowska)', 'królewski sakwojaż', 'pałac'], a: 1, e: '<i>sacellum</i> – kaplica.' },
    { q: 'Dlaczego <b>ornaverit</b> stoi w trybie łączącym?', o: ['to błąd', 'quod + coniunctivus: przyczyna przedstawiona jako przekonanie fundatorów', 'to czas przyszły', 'bo to rozkaz'], a: 1, e: 'Tzw. quod z coniunctivem przyczyny subiektywnej.' }
  ]
},

  tr: 'Dwuwiersz na portret Jerzego Gisze. Ten obraz, który widzisz, oddaje rysy Jerzego: takie ma on żywe oczy, takie policzki. W 34. roku życia. Roku Pańskiego 1532.',

  q: [

    { q: 'Ile lat miał Gisze według napisu?', o: ['32', '34 (34. rok życia)', '1532', '43'], a: 1, e: 'XXXIIII = 34; zapis IIII zamiast IV jest częsty.' },
    { q: 'Co oznacza słowo zapisane greckimi literami?', o: ['dwuwiersz (distichon)', 'portret', 'kupiec', 'Gdańsk'], a: 0, e: 'Humanistyczna maniera: greka jako ozdoba erudycji.' }

  page: 'https://commons.wikimedia.org/wiki/File:Book_of_Henryk%C3%B3w.PNG', credit: 'domena publiczna',
  read: '… uxor stab(at) sepissime ad molã molendo …\n… [vi]r suus idem .b. compassus dixit: Sine ut ego ĩ molam …\n… [ho]c ē ĩ polonico: Day ut ia pobrusa a ti poziwai. Sic ille …',

  tr: '…żona bardzo często stała przy żarnach i mełła. … Jej mąż, tenże Boguchwał, ulitowawszy się, powiedział: „Pozwól, niech i ja pomielę”, to jest po polsku: Daj, ać ja pobruszę, a ty poczywaj [= odpocznij].',

  q: [
    { q: 'Jak rozwinąć <b>molã</b>?', o: ['mola', 'molam', 'molendo', 'molis'], a: 1, e: 'Kreska nad samogłoską = opuszczone m lub n.' },

  /* ---------- Trening rozpoznawania form ---------- */
  var FILTERS = {
    noun: function (x) { return x.k === 'noun'; },
    adj: function (x) { return x.k === 'adj' || x.k === 'pron'; },
    presAct: function (x) { return x.k === 'verb' && (x.v === 'act.' || x.v === '') && x.m === 'ind.' && ['praes.', 'impf.', 'fut. I'].indexOf(x.t) >= 0; },
    perfPass: function (x) { return x.k === 'verb' && ((x.m === 'ind.' && ['perf.', 'pqpf.', 'fut. II'].indexOf(x.t) >= 0) || x.v === 'pass.'); },
    coni: function (x) { return x.k === 'verb' && x.m === 'coni.'; },
    part: function (x) { return x.k === 'part' || x.k === 'ger' || x.k === 'inf'; },
    any: function () { return true; }
  };
  function drill(el, cfg) {
    var pool = LEX.filter(function (e) { return cfg.classes.indexOf(e.cls) >= 0 && (e.fields.indexOf('rd') >= 0 || e.fields.indexOf('dok') >= 0 || e.fields.indexOf('pr') >= 0 || e.fields.indexOf('ma') >= 0 || e.fields.indexOf('ko') >= 0 || cfg.classes.length < 8); });
    var flt = FILTERS[cfg.filter] || FILTERS.any;
    var structured = false, N = 10, i = 0, ok = 0;
    var canStruct = cfg.filter === 'noun' || cfg.filter === 'presAct' || cfg.filter === 'coni' || cfg.filter === 'perfPass';
    function header() {
      return '<div class="row sp"><div><b>' + esc(cfg.label) + '</b> <span class="muted small">· ' + (i + 1) + ' / ' + N + ' · ' + I('check', 14) + ' ' + ok + '</span></div>' +
        (canStruct ? '<div class="levels" role="group" aria-label="Tryb"><button data-m="0" class="' + (structured ? '' : 'on') + '">wybór</button><button data-m="1" class="' + (structured ? 'on' : '') + '">analiza</button></div>' : '') + '</div>' +
        '<div class="qprog"><i style="width:' + (100 * i / N) + '%"></i></div>';
    }
    function next() {
      if (i >= N) {
        S.drills.ok += ok; S.drills.all += N; save();
        if (ok >= 8) G.celebrate({ icon: 'zap', kicker: ok === N ? 'Perfecte!' : 'Optime!', title: 'Trening: ' + ok + ' / ' + N, sub: 'Rozpoznawanie form wchodzi w krew.', stats: [[ok * 3, 'XP'], [Math.round(100 * ok / N) + '%', 'trafność']] });
        el.innerHTML = '<div class="score">Wynik: <b>' + ok + ' / ' + N + '</b></div><p class="muted">Łącznie w treningach: ' + S.drills.ok + ' / ' + S.drills.all + ' poprawnych.</p><button class="btn pri again">' + I('rotate', 18) + ' Jeszcze raz</button>';
        $('.again', el).onclick = function () { i = 0; ok = 0; next(); };
        return;
      }
      var e, fs, tries = 0;
      do { e = pick(pool); fs = LAT.forms(e).filter(flt); tries++; } while (!fs.length && tries < 50);
      // w dokumentach dominuje 3. osoba i pluralis maiestatis (1 os. lm.) – losuj je częściej
      var common = fs.filter(function (x) { return x.k !== 'verb' || x.p === 2 || x.p === 3 || x.p === 5; });
      var item = pick(common.length && Math.random() < 0.8 ? common : fs);
      var all = LAT.analysesOf(e, item.f).filter(flt);
      var goodLabels = all.map(function (x) { return x.an; });
      var html = header() + '<div class="card" style="text-align:center;margin-top:0"><div class="muted small">' + esc(e.head) + ' – ' + esc(e.pl) + '</div><div class="drill-form la">' + esc(item.f) + '</div><div class="muted small">Jaka to forma?</div></div>';
      if (!structured) {
        var others = shuffle(LAT.mergeLabels(fs.filter(function (x) { return goodLabels.indexOf(x.an) < 0 && LAT.norm(x.f) !== LAT.norm(item.f); }).map(function (x) { return x.an; })));
        var right = LAT.mergeLabels(goodLabels);
        var opts = shuffle([pick(right)].concat(others.slice(0, 3)));
        html += '<div class="opts">' + opts.map(function (o) { return '<button class="opt" data-v="' + esc(o) + '">' + labHTML(o) + '</button>'; }).join('') + '</div><div class="expl hidden"></div>';
        el.innerHTML = html;
        $$('.opt', el).forEach(function (b) {
          b.onclick = function () {
            var good = right.indexOf(b.dataset.v) >= 0;
            $$('.opt', el).forEach(function (x) { x.disabled = true; if (right.indexOf(x.dataset.v) >= 0) x.classList.add('right'); });
            if (!good) { b.classList.add('wrong'); G.wrong(b); } else { ok++; G.correct(b, 3); }
            fin(good, right);
          };
        });
      } else {
        var isNoun = item.k === 'noun';
        var sel = function (name, arr) { return '<label class="small muted">' + name + '<br><select data-k="' + name + '">' + arr.map(function (a) { return '<option value="' + a[0] + '">' + a[1] + '</option>'; }).join('') + '</select></label>'; };
        html += '<div class="row" style="justify-content:center;gap:14px">' + (isNoun
          ? sel('przypadek', [['nom.', 'mianownik (nom.)'], ['gen.', 'dopełniacz (gen.)'], ['dat.', 'celownik (dat.)'], ['acc.', 'biernik (acc.)'], ['abl.', 'ablatyw (abl.)']]) + sel('liczba', [['lp.', 'pojedyncza (lp.)'], ['lm.', 'mnoga (lm.)']])
          : sel('czas', [['praes.', 'teraźniejszy'], ['impf.', 'przeszły niedokonany'], ['fut. I', 'przyszły'], ['perf.', 'przeszły dokonany'], ['pqpf.', 'zaprzeszły'], ['fut. II', 'przyszły uprzedni']]) + sel('tryb', [['ind.', 'oznajmujący'], ['coni.', 'łączący']]) + sel('strona', [['act.', 'czynna'], ['pass.', 'bierna']]) + sel('osoba', [['1', '1.'], ['2', '2.'], ['3', '3.']]) + sel('liczba', [['lp.', 'pojedyncza'], ['lm.', 'mnoga']])) +
          '</div><div class="row" style="justify-content:center;margin-top:14px"><button class="btn pri chk">' + I('check', 18) + ' Sprawdź</button></div><div class="expl hidden"></div>';
        el.innerHTML = html;
        $('.chk', el).onclick = function () {
          var v = {}; $$('select', el).forEach(function (s) { v[s.dataset.k] = s.value; });
          var good = all.some(function (x) {
            if (isNoun) return LAT.CASES[x.cs] === v['przypadek'] && (x.nm === 's' ? 'lp.' : 'lm.') === v['liczba'];
            var p = (+v['osoba'] - 1) + (v['liczba'] === 'lm.' ? 3 : 0);

          });

          this.disabled = true;

        };
      }

    }
    function fin(good, right) {
      var ex = $('.expl', el); ex.className = 'expl ' + (good ? 'good' : 'badx');

        '<div class="row" style="margin-top:10px"><button class="btn pri nx">Dalej ' + I('right', 18) + '</button></div>';

  function srsGrade(id, g) {
    var c = S.srs[id] || { ef: 2.5, iv: 0, due: today(), reps: 0, lapses: 0 }, t = today();

      else if (c.reps === 2) c.iv = g === 1 ? 3 : g === 3 ? 7 : 6;

      c.ef = Math.max(1.3, c.ef + (g === 1 ? -0.15 : g === 3 ? 0.1 : 0));

  }

  function formulaFinder(text, out) {
    var words = [], re = /[A-Za-zÀ-ž]+/g, m;
    while ((m = re.exec(text))) words.push({ w: m[0], i: m.index, n: LAT.norm(m[0]) });
    var marks = new Array(words.length), found = [];
    LAT.FORMULAS.forEach(function (f, fi) {
      f[3].split('|').forEach(function (ph) {
        var pw = ph.trim().split(/\s+/).map(LAT.norm);
        for (var i = 0; i + pw.length <= words.length; i++) {
          var ok = true; for (var j = 0; j < pw.length; j++) if (words[i + j].n !== pw[j]) { ok = false; break; }
          if (ok) { for (var k = 0; k < pw.length; k++) marks[i + k] = f[0]; if (!found.some(function (x) { return x.fi === fi; })) found.push({ fi: fi, at: i }); }
        }
      });
    });
    var html = '', last = 0;
    words.forEach(function (w, i) { html += esc(text.slice(last, w.i)); html += marks[i] ? '<mark title="' + marks[i] + '">' + esc(w.w) + '</mark>' : esc(w.w); last = w.i + w.w.length; });
    html += esc(text.slice(last));
    found.sort(function (a, b) { return a.at - b.at; });
    out.innerHTML = '<div class="card la" style="font-size:1.12rem;line-height:1.8">' + html + '</div>' + (found.length ? '<h3>Rozpoznane formuły (' + found.length + ')</h3>' + found.map(function (x) { var f = LAT.FORMULAS[x.fi]; return '<div class="res"><span class="tag">' + f[0] + '</span> <i class="la">' + esc(f[1]) + '</i><div class="small">' + esc(f[2]) + '</div></div>'; }).join('') : '<p class="muted">Nie rozpoznano żadnej formuły z biblioteki.</p>');
  }

        var good = T.parts[+s.dataset.i][0], fb = s.parentNode.querySelector('.fb');
        if (s.value === good) { ok++; fb.innerHTML = '<span class="ok">' + I('check', 18) + '</span>'; } else fb.innerHTML = '<span class="bad">' + I('x', 18) + ' ' + good + '</span>';

      start();
    } else {
      tb.innerHTML = '<p>Wpisz słowo w pisowni źródła. Dostaniesz prawdopodobną pisownię klasyczną (do szukania w słowniku), opis zmian i analizę formy.</p><input type="text" id="sq" value="presencium" style="width:100%;max-width:360px" aria-label="Słowo"><div id="so"></div>' +
        '<div class="card small"><b>Najczęstsze odpowiedniki:</b> e ↔ ae/oe · ci ↔ ti · michi, nichil ↔ mihi, nihil · y ↔ i · mpn ↔ mn · j ↔ i · u/v · pojedyncze ↔ podwójne spółgłoski · h dodane/opuszczone (habundare, ortus).</div>';
      var gs = function () {
        var w = $('#sq').value.trim(); if (!w) { $('#so').innerHTML = ''; return; }
        var ex = LAT.explainSpelling(w), cl = classicize(w);
        $('#so').innerHTML = '<div class="card"><div class="muted small">Prawdopodobna pisownia klasyczna</div><div class="la" style="font-size:1.45rem"><i>' + esc(cl) + '</i></div>' + (ex.notes.length ? '<ul class="small">' + ex.notes.map(function (n) { return '<li>' + esc(n) + '</li>'; }).join('') + '</ul>' : '') + '<div class="muted small">Analizator:</div>' + autoAnalysis(w) + '</div>';
      };
      $('#sq').oninput = gs; gs();
    }
  };
  function classicize(w) {
    var res = LAT.analyze(w);
    if (res.length) { var key = LAT.norm(w), fm = LAT.forms(res[0].e).find(function (x) { return LAT.norm(x.f) === key; }); if (fm) return fm.f; }
    return LAT.explainSpelling(w).guess;
  }

  /* ============================================================
     NAZWY I MIARY
     ============================================================ */
  VIEWS.nazwy = function (el, args) {
    var tab = args[0] || 'miejsca';
    el.innerHTML = '<h1>Nazwy i miary</h1><p class="lead">Nazwy miejscowe i imiona występują w tekście w różnych przypadkach (<i class="la">in Cracovia, de Gnesna, Wratislaviensis</i>). Rozpoznanie ich oszczędza czas, a znajomość miar i monet pozwala zrozumieć wartość nadania.</p>' +
      tabs('nazwy', tab, [['miejsca', 'Miejscowości'], ['imiona', 'Imiona'], ['miary', 'Miary i monety'], ['quiz', 'Quiz']]) + '<div id="tb"></div>';
    bindTabs(el, 'nazwy');
    var tb = $('#tb');
    if (tab === 'miejsca' || tab === 'imiona') {
      var data = tab === 'miejsca' ? LAT.PLACES : LAT.NAMES;
      tb.innerHTML = '<input type="text" id="nq" placeholder="Szukaj…" style="width:100%;max-width:360px" aria-label="Szukaj"><div id="nl" class="tblwrap"></div>';
      var dn = function () {
        var q = LAT.norm($('#nq').value);
        var rows = data.filter(function (r) { return !q || LAT.norm(r.join(' ')).indexOf(q) >= 0; });
        $('#nl').innerHTML = '<table class="tbl"><tr><th>łacina</th>' + (tab === 'miejsca' ? '<th>przymiotnik</th>' : '') + '<th>polski</th><th>uwagi</th></tr>' + rows.map(function (r) {
          var i = data.indexOf(r);
          return '<tr><td><a href="#" class="la" data-i="' + i + '">' + esc(r[0]) + ', ' + esc(r[1]) + '</a></td>' + (tab === 'miejsca' ? '<td class="la">' + esc(r[3]) + '</td><td>' + esc(r[4]) + '</td><td class="small">' + esc(r[5]) + '</td>' : '<td>' + esc(r[3]) + '</td><td class="small">' + esc(r[4]) + '</td>') + '</tr><tr class="hidden" data-p="' + i + '"><td colspan="4"></td></tr>';
        }).join('') + '</table>';
        $$('#nl a[data-i]').forEach(function (a) {
          a.onclick = function (e) {
            e.preventDefault(); var r = data[+a.dataset.i], tr = $('#nl tr[data-p="' + a.dataset.i + '"]'); tr.classList.toggle('hidden');
            tr.firstChild.innerHTML = (r[2] !== 'x' && !/\//.test(r[0])) ? formsSummary({ parts: [r[0], r[1]], cls: r[2] }) : '<span class="muted">Forma nieodmienna lub zapisy wariantowe.</span>';
          };
        });
      };
      $('#nq').oninput = dn; dn();
    } else if (tab === 'miary') {
      tb.innerHTML = '<div class="tblwrap"><table class="tbl"><tr><th>łacina</th><th>polski</th><th>wartość</th><th>rodzaj</th></tr>' + LAT.MEASURES.map(function (m) { return '<tr><td class="la"><b>' + esc(m[0]) + '</b></td><td>' + esc(m[1]) + '</td><td class="small">' + esc(m[2]) + '</td><td class="small muted">' + esc(m[3]) + '</td></tr>'; }).join('') + '</table></div>' +
        '<p class="warn small">Wartości miar są przybliżone i zmieniały się w zależności od regionu i epoki.</p>' +
        '<div class="card"><h3>' + I('coins', 22) + ' Przelicznik monetarny (Kraków, XV–XVI w.)</h3><div class="row"><input type="number" inputmode="decimal" id="mv" value="1" style="width:110px" aria-label="Ilość"><select id="mu" aria-label="Jednostka"><option value="48">grzywna</option><option value="12">wiardunek</option><option value="2">skojec</option><option value="1">grosz</option><option value="30">złoty (floren obrachunkowy)</option><option value="60">kopa</option></select><span id="mo"></span></div></div>';
      var mc = function () { var g = (+$('#mv').value || 0) * +$('#mu').value; $('#mo').innerHTML = '= <b>' + g + '</b> groszy = ' + (g / 48).toFixed(2) + ' grzywny = ' + (g / 30).toFixed(2) + ' złotego'; };
      $('#mv').oninput = mc; $('#mu').onchange = mc; mc();
    } else {
      var qs = shuffle(LAT.PLACES.filter(function (p) { return /ensis/.test(p[3]); })).slice(0, 5).map(function (p) {
        var o = shuffle(LAT.PLACES.filter(function (x) { return x !== p; })).slice(0, 3).map(function (x) { return x[4]; });
        return { q: 'Co oznacza przymiotnik <i class="la">' + esc(p[3].split('/')[0]) + '</i>?', o: [p[4]].concat(o), a: 0, e: esc(p[0]) + ' – ' + esc(p[4]) };
      }).concat(shuffle(LAT.NAMES).slice(0, 5).map(function (n) {
        var o = shuffle(LAT.NAMES.filter(function (x) { return x !== n && x[3] !== n[3]; })).slice(0, 3).map(function (x) { return x[3]; });
        return { q: 'Polska forma imienia <i class="la">' + esc(n[0]) + '</i>?', o: [n[3]].concat(o), a: 0, e: esc(n[4]) };
      }));
      tb.innerHTML = '<div class="card" id="nqz"></div>'; quiz($('#nqz'), qs);
    }
  };

  /* ============================================================
     PUŁAPKI TŁUMACZA
     ============================================================ */
  VIEWS.pulapki = function (el) {
    var solved = Object.keys(S.traps).filter(function (k) { return S.traps[k]; }).length;
    el.innerHTML = '<h1>Pułapki tłumacza</h1><p class="lead">Poniżej są przekłady „maszynowe”: poprawne gramatycznie, ale błędne merytorycznie. Narzędzia AI radzą sobie z łaciną klasyczną przyzwoicie, ale w tekstach średniowiecznych potrafią z pewnością w głosie wymyślać sens. <b>Dotknij fragmentów przekładu, które są błędne</b>, i sprawdź.</p>' +
      '<div class="card"><div class="row sp"><b>Rozbrojone pułapki: <span id="tcount">' + solved + '</span> / ' + LAT.TRAPS.length + '</b></div><div class="qprog" style="margin-bottom:0"><i id="tprog" style="width:' + (100 * solved / LAT.TRAPS.length) + '%"></i></div></div><div id="tl"></div>';
    var box = $('#tl');
    shuffle(LAT.TRAPS).forEach(function (t) {
      var d = document.createElement('div'); d.className = 'card'; box.appendChild(d);
      var key = t.la;
      d.innerHTML = '<div class="la" style="font-size:1.25rem"><i>' + esc(t.la) + '</i></div><div class="muted small" style="margin-top:6px">Przekład maszynowy:</div><div style="font-size:1.1rem;margin:6px 0 10px">' + t.mt.map(function (s, i) { return '<span class="tok" role="button" tabindex="0" data-i="' + i + '">' + esc(s) + '</span>'; }).join(' ') + '</div><button class="btn sm pri chk">' + I('check', 16) + ' Sprawdź</button>' + (S.traps[key] ? ' <span class="done-mark small">' + I('check', 14) + ' rozbrojona wcześniej</span>' : '') + '<div class="expl hidden"></div>';
      var done = false;
      $$('.tok', d).forEach(function (s) { s.onclick = function () { if (!done) s.classList.toggle('sel'); }; s.onkeydown = function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); s.click(); } }; });
      $('.chk', d).onclick = function () {
        if (done) return; done = true; this.disabled = true; var ok = true;
        $$('.tok', d).forEach(function (s) {
          var i = +s.dataset.i, bad = t.bad.indexOf(i) >= 0, sel = s.classList.contains('sel'); s.classList.remove('sel');
          if (bad && sel) s.classList.add('hit'); else if (bad) { s.classList.add('miss'); ok = false; } else if (sel) { s.classList.add('false'); ok = false; }
        });
        var wasSolved = S.traps[key]; S.traps[key] = ok ? 1 : (S.traps[key] || 0); save();
        if (ok) G.correct(d, wasSolved ? 2 : 6); else G.wrong(d);
        var n = Object.keys(S.traps).filter(function (k) { return S.traps[k]; }).length; $('#tcount').textContent = n; $('#tprog').style.width = (100 * n / LAT.TRAPS.length) + '%';
        var e = $('.expl', d); e.className = 'expl ' + (ok ? 'good' : 'badx'); e.innerHTML = (ok ? '<b class="ok">Trafnie.</b> ' : '<b class="bad">Nie całkiem.</b> ') + 'Poprawnie: <b>' + esc(t.ok) + '</b><br>' + t.e;
      };
    });
  };

  /* ============================================================
     ANALIZATOR
     ============================================================ */
  VIEWS.analizator = function (el, args) {
    el.innerHTML = '<h1>Analizator form</h1><p class="lead">Wpisz formę (np. <i>dederunt</i>, <i>ecclesie</i>, <i>possidendam</i>) albo wklej całe zdanie. Analizator zna ' + (LEX.length + EXTRA.length) + ' haseł i rozpoznaje pisownię średniowieczną. Analizę wybierasz z kontekstu: aplikacja pokazuje wszystkie możliwości.</p>' +
      '<textarea id="az" placeholder="np. Nos Boleslaus notum facimus universis presentes litteras inspecturis" aria-label="Tekst do analizy">' + esc(args[0] || 'Datum in Cracovia presentibus hiis testibus') + '</textarea><div id="ao"></div>' +
      '<p class="small muted">Słów spoza słownika aplikacji szukaj w: <a href="https://logeion.uchicago.edu/" target="_blank" rel="noopener">Logeion</a>, <a href="https://www.perseus.tufts.edu/hopper/morph" target="_blank" rel="noopener">Perseus</a>; łacina średniowieczna: Du Cange, <i>Słownik łaciny średniowiecznej w Polsce</i>.</p>';
    var go = function () {
      var words = ($('#az').value.match(/[A-Za-zÀ-ž]+/g) || []).slice(0, 60);
      $('#ao').innerHTML = words.map(function (w) {
        var r = LAT.analyze(w);
        return '<div class="res"><span class="lem">' + esc(w) + '</span>' + (r.length ? r.map(function (x) { return '<div><b class="la">' + esc(x.e.head) + '</b> <span class="muted small">' + esc(LAT.CLS_LABEL[x.e.cls] || '') + '</span> – ' + esc(x.e.pl) + '<div class="small">' + x.labels.map(function (l) { return esc(lab(l)); }).join(' · ') + (x.enclitic ? ' · + ' + x.enclitic : '') + '</div></div>'; }).join('') : '<div class="small muted">nie znaleziono w słowniku aplikacji</div>') + '</div>';
      }).join('');
    };
    $('#az').oninput = go; go();
  };

  /* ============================================================
     SŁOWNICZEK (strona)
     ============================================================ */
  VIEWS.slowniczek = function (el) {
    el.innerHTML = '<h1>Słowniczek terminów</h1><p class="lead">Wszystkie skróty i nazwy gramatyczne używane w aplikacji, z polskim odpowiednikiem i przykładem. W lekcjach każdy termin jest podkreślony kropkami – dotknij go, a zobaczysz to samo wyjaśnienie.</p><input type="text" id="gq" placeholder="Szukaj…" style="width:100%;max-width:380px" aria-label="Szukaj terminu"><div class="card" id="gl"></div>';
    $('#gl').innerHTML = glossaryHTML(); $('#gq').oninput = function () { $('#gl').innerHTML = glossaryHTML(this.value); };
  };

  /* ============================================================
     USTAWIENIA
     ============================================================ */
  VIEWS.ustawienia = function (el) {
    var sw = function (id, label, desc, on) { return '<div class="switch"><div><b>' + label + '</b><div class="small muted">' + desc + '</div></div><label class="row" style="gap:6px"><input type="checkbox" id="' + id + '"' + (on ? ' checked' : '') + ' style="width:22px;height:22px"> ' + (on ? 'wł.' : 'wył.') + '</label></div>'; };
    el.innerHTML = '<h1>Ustawienia</h1>' +
      '<div class="card"><h3>Nauka</h3>' +
      sw('pll', 'Etykiety form po polsku', 'Np. „ablatyw, l. mn.” zamiast „abl. lm.” (łaciński skrót zostaje drobnym drukiem).', S.settings.plLabels) +
      sw('snd', 'Dźwięki nagród', 'Krótkie tony po poprawnej odpowiedzi i ukończeniu lekcji.', S.settings.sound) +
      '<div class="switch"><div><b>Cel dzienny</b><div class="small muted">Ile XP chcesz zdobywać dziennie (ok. 10 XP = 2 minuty).</div></div><select id="goal"><option value="30">30 XP – lekko</option><option value="50">50 XP – regularnie</option><option value="100">100 XP – intensywnie</option><option value="150">150 XP – maraton</option></select></div>' +
      '<div class="switch"><div><b>Nowe słowa dziennie</b><div class="small muted">Limit nowych fiszek na dzień.</div></div><input type="number" inputmode="numeric" id="npd" value="' + S.settings.newPerDay + '" min="0" max="100" style="width:90px"></div>' +
      '<div class="switch"><div><b>Kalendarz domyślny</b><div class="small muted">Dla kalkulatora dat.</div></div>' + calSelect('dcal') + '</div>' +
      '<div class="switch"><div><b>Motyw</b><div class="small muted">Jasny, ciemny lub zgodny z systemem.</div></div><select id="thm"><option value="">systemowy</option><option value="light">jasny</option><option value="dark">ciemny</option></select></div></div>' +
      '<div class="card"><h3>' + I('download', 22) + ' Tryb offline</h3><p class="small">Aplikacja działa bez internetu po pierwszym otwarciu. Zdjęcia z modułu „Łacina w obrazie” można zapisać w pamięci telefonu (ok. 15–25 MB).</p><button class="btn" id="offImg">' + I('download', 18) + ' Zapisz zdjęcia do użytku offline</button> <span id="offMsg" class="small muted"></span></div>' +
      '<div class="card"><h3>Kopia zapasowa</h3><p class="small">Postęp jest zapisany tylko w tej przeglądarce. Aby przenieść go na inne urządzenie, zapisz plik kopii i wczytaj go tam.</p><div class="row"><button class="btn" id="exp">' + I('download', 18) + ' Zapisz kopię</button><label class="btn">Wczytaj kopię<input type="file" id="imp" accept=".json" class="hidden"></label><button class="btn" id="rst">Wyzeruj postęp</button></div></div>' +
      '<div class="card small"><h3>O materiałach</h3><p>Teksty oznaczone jako <b>model</b> są dydaktyczne: ułożone na wzór formularzy źródłowych, z umownymi osobami i miejscami. Teksty oznaczone jako <b>źródło</b> to fragmenty autentyczne w tradycyjnym brzmieniu – przed cytowaniem w pracy naukowej sprawdź je w edycji krytycznej. Zdjęcia pochodzą z Wikimedia Commons (autor i licencja przy każdym zdjęciu). Czcionki: Crimson Pro i Atkinson Hyperlegible (Google Fonts, licencja OFL).</p></div>';
    $('#thm').value = S.settings.theme || ''; $('#goal').value = String(S.settings.goal);
    $('#pll').onchange = function () { S.settings.plLabels = this.checked; save(); VIEWS.ustawienia(el); };
    $('#snd').onchange = function () { S.settings.sound = this.checked; save(); G.updateStatus(); VIEWS.ustawienia(el); if (this.checked) G.sound('ok'); };
    $('#goal').onchange = function () { S.settings.goal = +this.value; save(); G.updateStatus(); };
    $('#npd').onchange = function () { S.settings.newPerDay = Math.max(0, +this.value || 0); save(); };
    $('#dcal').onchange = function () { S.settings.cal = this.value; save(); };
    $('#thm').onchange = function () { S.settings.theme = this.value; save(); if (this.value) document.documentElement.setAttribute('data-theme', this.value); else document.documentElement.removeAttribute('data-theme'); };
    $('#offImg').onclick = function () {
      var btn = this; if (!('caches' in window)) { $('#offMsg').textContent = 'Ta przeglądarka nie obsługuje zapisu offline.'; return; }
      btn.disabled = true; var urls = []; LAT.IMAGES.forEach(function (x) { urls.push(x.img); if (/\/1280px-/.test(x.img)) urls.push(x.img.replace('/1280px-', '/500px-')); });
      var n = 0;
      caches.open('lacina-img-v1').then(function (c) {
        return urls.reduce(function (p, u) { return p.then(function () { return fetch(u, { mode: 'no-cors' }).then(function (r) { return c.put(u, r); }).catch(function () { }).then(function () { n++; $('#offMsg').textContent = 'Zapisano ' + n + ' / ' + urls.length; }); }); }, Promise.resolve());
      }).then(function () { $('#offMsg').textContent = 'Gotowe: zdjęcia dostępne offline.'; btn.disabled = false; G.toast(I('download', 20) + ' Zdjęcia zapisane w pamięci urządzenia', 'goal', 2400); });
    };
    $('#exp').onclick = function () { var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' })); a.download = 'lacina-postep-' + new Date().toISOString().slice(0, 10) + '.json'; a.click(); };
    $('#imp').onchange = function () {
      var f = this.files[0]; if (!f) return; var r = new FileReader();
      r.onload = function () { try { var o = JSON.parse(r.result); if (!o.srs || !o.settings) throw 0; Object.keys(o).forEach(function (k) { S[k] = o[k]; }); save(); alert('Wczytano kopię.'); route(); } catch (e) { alert('To nie jest poprawny plik kopii.'); } };
      r.readAsText(f);
    };
    $('#rst').onclick = function () { if (confirm('Na pewno wyzerować cały postęp? Tego nie da się cofnąć (chyba że masz kopię).')) { localStorage.removeItem('lacina_historyka_v1'); location.reload(); } };
  };

  /* ---------- Start ---------- */
  function boot() {
    $('#burger') && ($('#burger').onclick = function (e) { e.stopPropagation(); openSide(true); });
    $('#scrim').onclick = function () { openSide(false); closeGlossary(); };
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { openSide(false); closeGlossary(); closeTermPop(); } });
    route();
    G.checkBadges();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
</body>
